        <button class="hbtn" onclick="openBrief()" title="Open latest brief">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>
          <span class="btxt">Brief</span></button>
        <button class="hbtn" onclick="openQuickAddSheet()">+ New job</button>
      </div>
      <div class="board-cols" id="board-cols-embed"></div>
    </div>
  </div>

  <div id="rail">
    <div class="card jobs-card">
      <div class="ch">
        <span class="ico" id="jobs-ico">✓</span><h3 id="jobs-title">Jobs</h3><span class="badge" id="jobs-count">0</span>
        <button class="hbtn" id="jobs-brief" onclick="openBrief()" title="Open latest brief">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>
          <span class="btxt">Brief</span></button>
        <button class="jsearch-btn" id="jobs-search-btn" onclick="openJobsSearch()" title="Search jobs">
          <svg class="fico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="expand" id="jobs-expand" onclick="jobsExpandTap()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="5" height="13" rx="1"/></svg>Expand</button>
        <div class="jsearch-pop hidden" id="jobs-search-pop">
          <svg class="fico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="jobs-search-input" placeholder="Search jobs…" autocomplete="off"
            oninput="onJobsSearchInput(event)" onkeydown="onJobsSearchKeydown(event)">
          <button class="jsearch-clear" onclick="closeJobsSearch()" title="Clear">×</button>
        </div>
      </div>
      <div class="modebar">
        <div class="seg" id="jobs-seg" data-mode="personal">
          <span class="glider"></span>
          <button data-m="personal" class="on" onclick="setJobsMode('personal')"><span class="sgl">✓</span>Personal</button>
          <button data-m="ado" onclick="setJobsMode('ado')"><span class="sgl">⬡</span>Assigned</button>
        </div>
      </div>
      <div class="qadd" id="jobs-qadd" onclick="qaddOpen()">
        <span class="qhint" id="qadd-hint">+ New job</span>
        <input id="qadd-input" class="hidden" placeholder="What needs doing?" autocomplete="off"
          onkeydown="qaddKey(event)" onblur="qaddBlur()">
        <button class="qgo hidden" id="qadd-go" onmousedown="event.preventDefault()" onclick="qaddSubmit()">Create</button>
      </div>
      <div class="idrow" id="jobs-idrow">
        <span class="avatar" id="ado-initials">··</span>
        <span class="idsum" id="ado-summary">—</span>
        <button class="idrefresh" id="ado-refresh" onclick="loadAdo(true)" title="Refresh from ADO">↻</button>
      </div>
      <div id="jobs-list" onclick="jobsListClick(event)"></div>
      <div class="synced hidden" id="ado-synced" onclick="loadAdo(true)"><span class="pulse"></span><span id="ado-synced-txt"></span></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
'use strict';

function toggleTheme() {
  const light = document.body.classList.toggle('light');
  try { localStorage.setItem('jobs-theme', light ? 'light' : 'dark'); } catch (e) {}
}

const API = '';
let cfg = null;

async function init() {
  try { cfg = await fetchJSON('/config'); }
  catch {
    document.getElementById('jobs-list').innerHTML =
      `<div class="empty">Could not reach sidecar — is jobs-sidecar.ps1 running?</div>`;
    cfg = {};
  }
  loadJobs();
  initJobsMode();
  setInterval(pollJobs, 5000);
  setInterval(tickAge, 5000);
}

function fetchJSON(path, opts) { return fetch(API + path, opts).then(r => r.json()); }
function h(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jss(s) { return h(String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function isHttpUrl(s) { return /^https?:\/\//.test(String(s || '')); }
function prChip(j) {
  return isHttpUrl(j.pr) ? `<a class="prchip" href="${h(j.pr)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">PR</a>` : '';
}

let lastPollAt = null;
function tickAge() {
  if (railShowsAdo()) updateAdoSynced();
  const el = document.getElementById('strip-age');
  if (!lastPollAt) { el.textContent = ''; return; }
  const s = Math.round((Date.now() - lastPollAt) / 1000);
  el.textContent = `polled ${s < 5 ? 'just now' : s + 's ago'}`;
}

// --- jobs --------------------------------------------------------------------
const JOB_STATUSES = ['Planned','Ready','In progress','Review','PR','Done','Parked','Blocked','Removed'];
const BOARD_COLS = ['Planned','Ready','In progress','Review','PR','Blocked','Parked','Done'];
const RAIL_ORDER = ['Review','In progress','PR','Ready','Planned','Blocked','Parked','Done','Removed'];
const railRank = s => { const i = RAIL_ORDER.indexOf(s); return i < 0 ? RAIL_ORDER.length : i; };
const DOT = { 'In progress':'var(--accent)', 'Review':'var(--review)', 'Ready':'var(--ready)', 'Blocked':'var(--fail)', 'Parked':'var(--warn)', 'Planned':'var(--faint)', 'PR':'var(--pr)', 'Done':'var(--ok)', 'Removed':'var(--faint)' };
let jobs = [];
const jobClass = s => 's-' + String(s||'').toLowerCase().replace(/\s+/g,'');
const isActive = j => j.status !== 'Removed' && j.status !== 'Done';

let jobsQuery = '';
function jobMatches(j, q) {
  const qq = String(q || '').trim().toLowerCase().replace(/^#/, '');
  if (!qq) return true;
  if (j.num != null && String(j.num).toLowerCase().includes(qq)) return true;
  return [j.label, j.note, j.branch].some(f => f && String(f).toLowerCase().includes(qq));
}

// Board search: scroll the kanban container(s) so the first (leftmost) column with a
// match is in view. Runs on every search keystroke, both the modal board and the
// embedded wide-viewport pane share the .board-cols class. No-op on empty query
// (search cleared) or no matches, and skipped if the column is already fully visible.
function jumpBoardColumns() {
  const q = jobsQuery.trim();
  if (!q) return;
  const firstCol = BOARD_COLS.find(col => jobs.some(j => j.status === col && jobMatches(j, jobsQuery)));
  if (!firstCol) return;
  document.querySelectorAll('.board-cols').forEach(container => {
    const el = container.querySelector(`.bcol[data-col="${CSS.escape(firstCol)}"]`);
    if (!el) return;
    const contRect = container.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    const fullyVisible = elRect.left >= contRect.left && elRect.right <= contRect.right;
    if (!fullyVisible) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
  });
}

let jobsSnapshot = '';
async function loadJobs() {
  try {
    const d = await fetchJSON('/jobs');
    const snap = JSON.stringify(d.jobs || []);
    if (snap === jobsSnapshot) { lastPollAt = Date.now(); tickAge(); return; }
    jobsSnapshot = snap;
    jobs = d.jobs || [];
    renderJobsRail();
    renderBoardPane();
    refreshOpenModals();
    lastPollAt = Date.now();
    tickAge();
  } catch { }
}

function openBrief() {
  window.open('/briefs/latest.html', 'jobs-brief');
}

function jobsInteracting() {
  if (dragId) return true;
  const a = document.activeElement;
  if (a && (a.id === 'jobs-search-input' || a.id === 'qadd-input')) return true;
  return !!(a && a.closest && a.closest('.modal') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function pollJobs() {
  // the wide board pane shows personal jobs regardless of jobsMode, so keep polling there
  if ((jobsMode !== 'personal' && !isWideView()) || jobsInteracting()) return;
  await loadJobs();
}

function renderJobsRail() {
  if (railShowsAdo()) return;
  const list = document.getElementById('jobs-list');
  const filtering = !!jobsQuery.trim();
  const pool = filtering ? jobs : jobs.filter(isActive);
  const shown = pool.filter(j => jobMatches(j, jobsQuery)).sort((a,b) => railRank(a.status) - railRank(b.status));
  document.getElementById('jobs-count').textContent = shown.length;
  if (!shown.length) {
    list.innerHTML = filtering
      ? `<div class="empty">No jobs match "${h(jobsQuery)}".</div>`
      : `<div class="empty">No jobs yet. Add one to get started.</div>`;
    return;
  }
  list.innerHTML = shown.map(j => `
    <div class="job ${jobClass(j.status)}" onclick="openJob('${h(j.id)}')">
      <div class="jhead">
        ${j.num ? `<span class="jnum">#${j.num}</span>` : ''}
        <span class="st">${h(j.status)}</span>
      </div>
      <div class="jl">${h(j.label)}</div>
      ${j.branch ? `<div class="jb">${h(j.branch)}</div>` : ''}
      ${prChip(j)}
    </div>`).join('');
}

// Wide-viewport embedded board pane — same column markup as the modal board, just rendered
// inline instead of inside a modal-bg. Kept in sync by loadJobs()/refreshOpenModals().
function renderBoardPane() {
  const pane = document.getElementById('board-cols-embed');
  if (!pane) return;
  document.getElementById('board-count').textContent = jobs.filter(isActive).length;
  pane.innerHTML = renderBoardCols();
  attachBoardWheel(pane);
}

// Wheel over the board scrolls the hovered column up/down while it still has
// somewhere to go; the moment it can't (or you're over a header/gap), the
// vertical wheel slides the whole board sideways. Idempotent per element so
// re-renders that reuse the same container don't stack listeners.
function attachBoardWheel(bc) {
  if (!bc || bc.dataset.wheelBound) return;
  bc.dataset.wheelBound = '1';
  bc.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // genuine horizontal swipe: let it scroll natively
    const cards = e.target.closest('.bcards');
    if (cards) {
      const room = e.deltaY > 0
        ? cards.scrollHeight - cards.clientHeight - cards.scrollTop  // room below
        : cards.scrollTop;                                          // room above
      if (room > 0) return; // the column can still scroll this way — let it
    }
    bc.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
}

// --- jobs: rail search pop-out ----------------------------------------------
let jobsSearchOpen = false;
function updateJobsSearchIcon() {
  const btn = document.getElementById('jobs-search-btn');
  if (btn) btn.classList.toggle('active', !!jobsQuery.trim() && !jobsSearchOpen);
}
function openJobsSearch() {
  jobsSearchOpen = true;
  const pop = document.getElementById('jobs-search-pop');
  const expandBtn = document.getElementById('jobs-expand');
  pop.style.right = (expandBtn.offsetWidth + 8) + 'px';
  pop.classList.remove('hidden');
  const input = document.getElementById('jobs-search-input');
  input.value = jobsQuery;
  input.focus();
  updateJobsSearchIcon();
}
function closeJobsSearchPopout() {
  jobsSearchOpen = false;
  document.getElementById('jobs-search-pop').classList.add('hidden');
  updateJobsSearchIcon();
}
function closeJobsSearch() {
  closeJobsSearchPopout();
  jobsQuery = '';
  document.getElementById('jobs-search-input').value = '';
  applySearch(null);
}

// One search state, three possible inputs (rail pop-out, embedded board pane,
// takeover board). Re-render every board surface and mirror the query into the
// inputs the user ISN'T typing in.
function applySearch(src) {
  renderJobsRail();
  renderBoardPane();
  const mcols = document.querySelector('.modal.board .board-cols');
  if (mcols) mcols.innerHTML = renderBoardCols();
  document.querySelectorAll('.bsearch input').forEach(i => { if (i !== src) i.value = jobsQuery; });
  document.querySelectorAll('.bsearch-clear').forEach(b => b.classList.toggle('hidden', !jobsQuery));
  const railInput = document.getElementById('jobs-search-input');
  if (railInput && railInput !== src) railInput.value = jobsQuery;
  updateJobsSearchIcon();
  jumpBoardColumns();
}

// --- quick-add: title-only, pinned at the top of the rail --------------------
function qaddOpen() {
  const q = document.getElementById('jobs-qadd');
  q.classList.add('open');
  document.getElementById('qadd-hint').classList.add('hidden');
  document.getElementById('qadd-input').classList.remove('hidden');
  document.getElementById('qadd-go').classList.remove('hidden');
  document.getElementById('qadd-input').focus();
}
function qaddClose() {
  const q = document.getElementById('jobs-qadd');
  q.classList.remove('open');
  document.getElementById('qadd-hint').classList.remove('hidden');
  document.getElementById('qadd-input').classList.add('hidden');
  document.getElementById('qadd-go').classList.add('hidden');
  document.getElementById('qadd-input').value = '';
}
function qaddKey(e) {
  if (e.key === 'Enter') qaddSubmit();
  if (e.key === 'Escape') { e.stopPropagation(); qaddClose(); }
}
function qaddBlur() { if (!document.getElementById('qadd-input').value.trim()) qaddClose(); }
function qaddSubmit() {
  const t = document.getElementById('qadd-input').value.trim();
  if (!t) return;
  qaddClose();
  addJob(t, '', '');
}

// title-only sheet — reached from the board headers (+ New job) and the FAB variant
function openQuickAddSheet() {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal detail m-add" onclick="event.stopPropagation()">
        <div class="mhead"><span class="mico">✓</span><h2>New job</h2>
          <button class="mclose" onclick="closeModal()">×</button></div>
        <div class="detail-body">
          <div class="dsec"><h4>Title</h4>
            <input class="m-fld" id="qs-title" placeholder="What needs doing?" autocomplete="off"
              onkeydown="if(event.key==='Enter')submitQuickAdd()"></div>
          <div class="empty">Repo, branch and notes live in the detail view — it opens as soon as the job is created.</div>
        </div>
        <div class="dollar">
          <button class="dbtn" onclick="closeModal()">Cancel</button>
          <button class="dbtn prime" onclick="submitQuickAdd()">Create job</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('qs-title')?.focus(), 60);
}
function submitQuickAdd() {
  const t = document.getElementById('qs-title').value.trim();
  if (!t) { document.getElementById('qs-title').focus(); return; }
  addJob(t, '', '');
}
function onJobsSearchInput(e) {
  jobsQuery = e.target.value;
  applySearch(e.target);
}
function onJobsSearchKeydown(e) {
  if (e.key === 'Escape') closeJobsSearch();
}

// --- jobs: Assigned (ADO) mode --------------------------------------------
// The Personal/Assigned mode only exists on narrow/slab viewports, where the rail
// is the whole app. On a wide viewport the board pane owns personal jobs, so the
// rail is always the Assigned card — railShowsAdo() is the single source of truth
// for what the rail renders, fed by both setJobsMode() and applyResponsiveMode().
let jobsMode = 'personal';
let adoData = null;
let adoFetchedAt = null;

const isWideView = () => !document.body.classList.contains('narrow') && !document.body.classList.contains('slab');
const railShowsAdo = () => isWideView() || jobsMode === 'ado';

function initJobsMode() {
  let m = 'personal';
  try { const v = localStorage.getItem('jobs-mode'); if (v === 'ado' || v === 'personal') m = v; } catch {}
  setJobsMode(m);
}

function setJobsMode(m) {
  jobsMode = m;
  document.getElementById('jobs-seg').dataset.mode = m;
  document.querySelectorAll('#jobs-seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.body.classList.toggle('ado', m === 'ado');
  try { localStorage.setItem('jobs-mode', m); } catch {}
  applyRail();
}

function applyRail() {
  const ado = railShowsAdo();
  document.getElementById('jobs-ico').textContent = ado ? '⬡' : '✓';
  document.getElementById('jobs-title').textContent = ado ? 'Assigned' : 'Jobs';
  document.getElementById('jobs-idrow').style.display = ado ? 'flex' : 'none';
  document.getElementById('jobs-qadd').classList.toggle('hidden', ado);
  document.getElementById('jobs-search-btn').classList.toggle('hidden', ado);
  document.getElementById('ado-synced').classList.toggle('hidden', !ado);
  const exp = document.getElementById('jobs-expand');
  exp.innerHTML = ado ? 'Open in ADO ↗' : '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="5" height="13" rx="1"/></svg>Expand';
  exp.classList.toggle('aslink', ado && isWideView());
  if (ado) { closeJobsSearchPopout(); if (adoData) renderAdo(); loadAdo(false); }
  else { renderJobsRail(); updateJobsSearchIcon(); }
}

function jobsExpandTap() {
  if (railShowsAdo()) { const u = cfg && cfg.ado && cfg.ado.boardUrl; if (u) window.open(u, '_blank', 'noopener'); }
  else openKanban();
}

function jobsListClick(e) {
  if (railShowsAdo()) return;
  if (!e.target.closest('.job')) jobsEmptyTap();
}

let adoLoading = false;
async function loadAdo(refresh) {
  if (!railShowsAdo()) return;
  if (adoLoading && !refresh) return;
  adoLoading = true;
  const list = document.getElementById('jobs-list');
  const btn  = document.getElementById('ado-refresh');
  if (refresh) btn.classList.add('spin');
  if (!adoData) list.innerHTML = `<div class="empty">Loading from ADO…</div>`;
  const demo = new URLSearchParams(location.search).get('demo') === '1';
  const qs = demo ? '?demo=1' : (refresh ? '?refresh=1' : '');
  try {
    const d = await fetchJSON('/ado/assigned' + qs);
    if (d && d.error && !d.stale) { renderAdoError(d.error); return; }
    adoData = d;
    renderAdo();
  } catch (err) {
    console.error('[loadAdo]', err);
    renderAdoError("Couldn't reach the sidecar — is the jobs sidecar running?");
  } finally {
    adoLoading = false;
    btn.classList.remove('spin');
  }
}

function renderAdoError(msg) {
  if (!railShowsAdo()) return;
  document.getElementById('jobs-list').innerHTML =
    `<div class="empty">${h(msg)} <a href="#" onclick="loadAdo(true);return false;" style="color:var(--accent)">Retry</a></div>`;
  document.getElementById('ado-summary').innerHTML = '—';
  document.getElementById('ado-initials').textContent = '··';
  document.getElementById('ado-synced').classList.add('err');
  document.getElementById('ado-synced-txt').textContent = 'ADO unreachable — tap to retry';
}

const adoStateClass = s => 'a-' + String(s||'').toLowerCase().replace(/\s+/g,'');

function renderAdo() {
  if (!railShowsAdo() || !adoData) return;
  const d = adoData, c = d.counts || { stories:0, tasks:0, done:0 };
  document.getElementById('jobs-count').textContent = c.tasks;
  const av = document.getElementById('ado-initials');
  av.textContent = (d.identity && d.identity.initials) || '··';
  av.title = (d.identity && d.identity.upn) || '';
  document.getElementById('ado-summary').innerHTML =
    `<b>${Number(c.stories)}</b> ${c.stories===1?'story':'stories'} · <b>${Number(c.tasks)}</b> ${c.tasks===1?'task':'tasks'} · <span class="done">${Number(c.done)} done</span>`;
  adoFetchedAt = d.fetchedAt;
  const syncEl = document.getElementById('ado-synced');
  if (d.stale) {
    syncEl.classList.add('err');
    document.getElementById('ado-synced-txt').textContent = 'Stale data — ADO unreachable · tap to retry';
    console.warn('[ADO stale]', d.staleReason);
  } else {
    syncEl.classList.remove('err');
  }
  updateAdoSynced();

  const stories = d.stories || [];
  const list = document.getElementById('jobs-list');
  if (!stories.length) { list.innerHTML = `<div class="empty">No open tasks assigned to you this sprint. 🎉</div>`; return; }
  list.innerHTML = stories.map(renderStory).join('');
}

function renderStory(s) {
  const tasks = (s.tasks || []).map(t => `
    <div class="task">
      <div class="task-head" onclick="adoToggle(this.closest('.task'))">
        <div class="task-top">
          <span class="id"><span class="hash">#</span>${t.id}</span>
          <span class="state ml ${adoStateClass(t.state)}">${h(t.state)}</span>
        </div>
        <div class="task-title">${h(t.title)}</div>
      </div>
      <div class="ado-pane">
        <div class="ado-text"${t.description?'':' style="color:var(--faint)"'}>${t.description ? h(t.description) : 'No description.'}</div>
        <a class="ado-open" href="${h(t.url)}" target="_blank" rel="noopener">Open in ADO ↗</a>
      </div>
    </div>`).join('');
  const tags = (s.tags || []).map(tg => `<span class="ado-tag">${h(tg)}</span>`).join('');
  const hasDesc = !!s.description;
  const hasAc   = !!s.ac;
  return `
    <div class="story ${s.state==='Ready'?'st-ready':''}">
      <div class="story-head">
        <div class="story-top">
          <span class="story-type">Story</span>
          <span class="id"><span class="hash">#</span>${s.id}</span>
          <span class="state ml ${adoStateClass(s.state)}">${h(s.state)}</span>
        </div>
        <div class="story-title">${h(s.title)}</div>
      </div>
      <div class="story-meta">
        <div class="ado-meta-row">
          ${tags ? `<div class="ado-tags">${tags}</div>` : ''}
          <a class="ado-open" href="${h(s.url)}" target="_blank" rel="noopener">Open in ADO ↗</a>
        </div>
        ${hasDesc || hasAc ? `
        <div class="ado-toggles">
          ${hasDesc ? `<button class="ado-toggle" data-idx="0" onclick="adoSectionToggle(this)">description <span class="ado-arr">↓</span></button>` : ''}
          ${hasAc   ? `<button class="ado-toggle" data-idx="1" onclick="adoSectionToggle(this)">acceptance criteria <span class="ado-arr">↓</span></button>` : ''}
        </div>` : ''}
        ${hasDesc ? `<div class="ado-section" data-idx="0"><div class="ado-text">${h(s.description)}</div></div>` : ''}
        ${hasAc   ? `<div class="ado-section" data-idx="1"><div class="ado-text">${h(s.ac)}</div></div>` : ''}
      </div>
      <div class="tasks">
        <div class="tasks-h">Tasks<span class="ln"></span>${(s.tasks||[]).length}</div>
        ${tasks}
      </div>
    </div>`;
}

function adoToggle(card) { if (card) card.classList.toggle('open'); }

function adoSectionToggle(btn) {
  const meta  = btn.closest('.story-meta');
  const idx   = btn.dataset.idx;
  const section = meta.querySelector(`.ado-section[data-idx="${idx}"]`);
  const isOpen  = section.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
}

function updateAdoSynced() {
  if (!adoFetchedAt) return;
  if (adoData && adoData.stale) return;
  const ago = s => { const sec = Math.max(0,(Date.now()-new Date(s).getTime())/1000);
    if (sec<90) return 'just now'; if (sec<5400) return Math.round(sec/60)+'m ago';
    if (sec<129600) return Math.round(sec/3600)+'h ago'; return Math.round(sec/86400)+'d ago'; };
  document.getElementById('ado-synced-txt').textContent = `synced with ADO · ${ago(adoFetchedAt)}`;
}

async function saveJob(id, updates) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  const body = { id:j.id, label:j.label, branch:j.branch, repo:j.repo, status:j.status, note:j.note, docs:j.docs, pr:j.pr, ...updates };
  await fetchJSON('/jobs', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  await loadJobs();
}
async function setJobStatus(id, status) { await saveJob(id, { status }); }
async function setJobRepo(id, repo) {
  await saveJob(id, { repo });
  loadBranchOptions('job-repo', 'job-branch-list');
  const j = jobs.find(x => x.id === id);
  if (j) loadJobCommits(j);
}
async function setJobBranch(id, branch) {
  await saveJob(id, { branch });
  const j = jobs.find(x => x.id === id);
  if (j) loadJobCommits(j);
}
async function setJobPr(id, pr) { await saveJob(id, { pr: pr.trim() }); }
async function deleteJob(id) {
  await fetchJSON(`/jobs/${id}`, { method:'DELETE' });
  closeModal();
  await loadJobs();
}
async function addJob(label, branch, repo) {
  if (!label) return;
  const job = await fetchJSON('/jobs', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ label, branch, repo }) });
  await loadJobs();
  if (job && job.id) openJob(job.id, { focusNote: true });
}

// --- modals ----------------------------------------------------------------
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function refreshOpenModals() {
  const board = document.querySelector('.modal.board');
  if (board) {
    const cols = document.querySelector('.modal.board .board-cols');
    const x = cols ? cols.scrollLeft : 0;
    const y = {};
    board.querySelectorAll('.bcol').forEach(c => { y[c.dataset.col] = c.querySelector('.bcards').scrollTop; });
    openKanban();
    const cols2 = document.querySelector('.modal.board .board-cols');
    if (cols2) cols2.scrollLeft = x;
    document.querySelectorAll('.modal.board .bcol').forEach(c => {
      if (c.dataset.col in y) c.querySelector('.bcards').scrollTop = y[c.dataset.col];
    });
  }
  const open = document.querySelector('.modal.detail');
  if (open && open.dataset.jobId) openJob(open.dataset.jobId);
}

function renderBoardCols() {
  return BOARD_COLS.map(col => {
    let items = jobs.filter(j => j.status === col && jobMatches(j, jobsQuery));
    if (col === 'Done' || col === 'Removed') {
      items = items.slice().sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    }
    return `<div class="bcol" data-col="${h(col)}" ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event)">
      <div class="bcolh"><span class="dot" style="background:${DOT[col]}"></span>${col}<span class="ct">${items.length}</span></div>
      <div class="bcards">${items.map(j =>
        `<div class="bcard" draggable="true" ondragstart="boardDragStart(event,'${h(j.id)}')" ondragend="boardDragEnd(event)" onclick="openJob('${h(j.id)}')">${j.num?`<div class="bjnum">#${j.num}</div>`:''}<div class="l">${h(j.label)}</div>${j.branch?`<div class="b">${h(j.branch)}</div>`:''}${prChip(j)}</div>`).join('')}</div>
    </div>`;
  }).join('');
}

// The kanban TAKEOVER — full-screen board reached from the rail's Expand button
// (narrow/portrait) or as a focus mode on wide viewports. Same modal-root plumbing,
// but stretched edge to edge; creation goes through the + (quick-add sheet).
function openKanban() {
  const blocked = jobs.filter(j => j.status === 'Blocked').length;

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg takeover">
      <div class="modal board">
        <div class="mhead"><span class="mico">✓</span><h2>Jobs board</h2>
          <span class="badge">${jobs.filter(isActive).length} active${blocked?` · ${blocked} blocked`:''}</span>
          <div class="bsearch">
            <input placeholder="Search…" autocomplete="off" value="${h(jobsQuery)}" oninput="onBoardSearchInput(event)">
            <button class="bsearch-clear${jobsQuery ? '' : ' hidden'}" onclick="clearBoardSearch()" title="Clear">×</button>
          </div>
          <button class="hbtn" onclick="openBrief()" title="Open latest brief">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>
            <span class="btxt">Brief</span></button>
          <button class="mplus" onclick="openQuickAddSheet()" title="New job">+</button>
          <button class="mclose" onclick="closeModal()">×</button>
        </div>
        <div class="board-cols">${renderBoardCols()}</div>
      </div>
    </div>`;
  attachBoardWheel(document.querySelector('.modal.board .board-cols'));
}

function onBoardSearchInput(e) {
  jobsQuery = e.target.value;
  applySearch(e.target);
}
function clearBoardSearch() {
  jobsQuery = '';
  applySearch(null);
}

async function loadBranchOptions(repoSelId, listId) {
  const repo = document.getElementById(repoSelId).value;
  const list = document.getElementById(listId);
  list.innerHTML = '';
  if (!repo) return;
  try {
    const r = await fetchJSON(`/git/branches?repo=${encodeURIComponent(repo)}`);
    list.innerHTML = (r.branches || []).map(b => `<option value="${h(b)}">`).join('');
  } catch { }
}

// --- kanban drag-and-drop (both the modal board and the embedded wide-viewport pane) -------
let dragId = null;
function boardDragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); }
function boardDragEnd(e) { dragId = null; e.currentTarget.classList.remove('dragging'); }
function boardDragOver(e) { if (dragId) { e.preventDefault(); e.currentTarget.classList.add('dragover'); } }
function boardDragLeave(e) { e.currentTarget.classList.remove('dragover'); }
function boardDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const col = e.currentTarget.dataset.col;
  const j = jobs.find(x => x.id === dragId);
  if (j && col && j.status !== col) setJobStatus(dragId, col);
}

function docType(name) {
  if (/\.md$/i.test(name)) return 'md';
  if (/\.(cs|ts|js|jsx|tsx|json|ps1|psm1|sql|cshtml|razor|xml|yml|yaml)$/i.test(name)) return 'code';
  return 'other';
}
function openDoc(path, type) {
  const p = String(path);
  if (/^https?:\/\//i.test(p)) { window.open(p, '_blank', 'noopener'); return; }
  if (/\.html?$/i.test(p)) { fetch(API + '/open', { method:'POST', body: JSON.stringify({ path: p }) }); return; }
  const a = document.createElement('a');
  a.href = 'vscode://file/' + p.replace(/\\/g,'/');
  document.body.appendChild(a); a.click(); a.remove();
}

function copyPath(path, btn) {
  navigator.clipboard.writeText(String(path)).then(() => {
    const prev = btn.textContent;
    btn.textContent = '✓'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = prev; btn.classList.remove('ok'); }, 1100);
  });
}

function openJob(id, opts) {
  opts = opts || {};
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  const docs = (Array.isArray(j.docs) ? j.docs : []).filter(Boolean);
  const docsHtml = docs.length ? docs.map((d, i) => {
    const name = d.name || (d.path||'').split(/[\\/]/).pop();
    const t = d.type || docType(name);
    return `<div class="doc" onclick="openDoc('${jss(d.path)}','${t}')" title="${h(d.path)}">
        <span class="di ${t}">${t==='md'?'MD':t==='code'?'{}':'··'}</span>
        <div class="dmeta"><div class="dn">${h(name)}</div><div class="dp">${h(d.path)}</div></div>
        <button class="dcp" title="Copy path" onclick="event.stopPropagation();copyPath('${jss(d.path)}',this)">⧉</button>
        <button class="drm" title="Remove document" onclick="event.stopPropagation();removeDoc('${h(j.id)}',${i})">×</button>
      </div>`;
  }).join('') : `<div class="empty">No linked documents yet.</div>`;

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal detail" data-job-id="${h(j.id)}" onclick="event.stopPropagation()">
        <div class="mhead"><button class="mboard" title="Jobs board" onclick="openKanban()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="5" height="13" rx="1"/></svg></button><span class="mico">✓</span>${j.num ? `<span class="mnum">#${j.num}</span>` : ''}<h2>${h(j.label)}</h2><button class="mclose" onclick="closeModal()">×</button></div>
        <div class="detail-body">
          <div class="drow">
            <label class="dfield">
              <span class="dlabel">Status</span>
              <select class="dsel" onchange="setJobStatus('${h(j.id)}', this.value)">
                ${JOB_STATUSES.map(s => `<option${s===j.status?' selected':''}>${s}</option>`).join('')}
              </select>
            </label>
            <label class="dfield">
              <span class="dlabel">Repo</span>
              <select class="dsel" id="job-repo" onchange="setJobRepo('${h(j.id)}', this.value)">
                <option value="">— none —</option>
                ${Object.keys(cfg.repos||{}).map(k => `<option${k===j.repo?' selected':''}>${h(k)}</option>`).join('')}
              </select>
            </label>
            <label class="dfield fwide">
              <span class="dlabel">Branch</span>
              <span class="fwrap">
                <input class="dsel mono-fld" id="job-branch" list="job-branch-list"
                  value="${h(j.branch||'')}" placeholder="branch…" autocomplete="off"
                  onchange="setJobBranch('${h(j.id)}', this.value)">
                <datalist id="job-branch-list"></datalist>
                <button class="prtoggle${isHttpUrl(j.pr) ? ' has' : ''}" type="button" title="PR"
                  onclick="event.preventDefault();togglePrRow()">↗</button>
              </span>
            </label>
          </div>
          <div class="drow" id="pr-row">
            <label class="dfield fwide">
              <span class="dlabel">PR</span>
              <span class="fwrap">
                <input class="dsel mono-fld${isHttpUrl(j.pr) ? ' padlink' : ''}" id="job-pr"
                  value="${h(j.pr||'')}" placeholder="PR URL…" autocomplete="off"
                  onchange="setJobPr('${h(j.id)}', this.value)">
                ${isHttpUrl(j.pr) ? `<a class="prlink" href="${h(j.pr)}" target="_blank" rel="noopener" title="Open PR">↗</a>` : ''}
              </span>
            </label>
          </div>
          <div class="dsec">
            <h4>Notes</h4>
            <div id="job-notes-wrap">${fmtNotes(j.note, j.id)}</div>
          </div>
          <div class="dcols">
            <div class="dsec dcol col-commits">
              <h4>Commits ${j.branch ? `<span class="cbranch">${h(j.repo || '?')} · ${h(j.branch)}</span>` : ''}</h4>
              <div class="commits" id="job-commits"></div>
            </div>
            <div class="dsec dcol col-docs">
              <h4>Linked documents <span class="add" onclick="addDoc('${h(j.id)}')">+ Add document</span></h4>
              <div class="docs">${docsHtml}</div>
            </div>
          </div>
        </div>
        <div class="dollar">
          <button class="dbtn danger" onclick="if(confirm('Delete this job?')) deleteJob('${h(j.id)}')">Delete</button>
          <button class="dbtn prime" onclick="saveNotes('${h(j.id)}')">Save notes</button>
          <button class="dbtn" onclick="closeModal()">Done</button>
        </div>
      </div>
    </div>`;
  loadJobCommits(j);
  if (j.repo) loadBranchOptions('job-repo', 'job-branch-list');
  if (opts.focusNote) setTimeout(() => notesEdit(j.id), 60);
}

async function loadJobCommits(j) {
  const el = document.getElementById('job-commits');
  if (!el) return;
  if (!j.repo || !j.branch) {
    el.innerHTML = `<div class="empty">Pin a repo and branch to see its commit graph.</div>`;
    return;
  }
  el.innerHTML = `<div class="empty">Loading commits…</div>`;
  let r;
  try { r = await fetchJSON(`/git/log?repo=${encodeURIComponent(j.repo)}&branch=${encodeURIComponent(j.branch)}`); }
  catch { el.innerHTML = `<div class="empty">Could not read git history.</div>`; return; }
  if (r.error || !r.commits || !r.commits.length) {
    el.innerHTML = `<div class="empty">${h(r.error === 'branch not found' ? `Branch "${j.branch}" not found in ${j.repo}.` : 'No commits on this branch.')}</div>`;
    return;
  }
  const MOBILE_COMMITS = 5;   // narrow mode collapses the rest behind .cmore
  el.innerHTML = r.commits.map((c, i) => {
    const files = (c.files || []).map(f =>
      `<div class="cf"><span class="cs cs-${h((f.status||'').charAt(0))}">${h((f.status||'').charAt(0))}</span><span class="cfp">${h(f.path)}</span></div>`).join('');
    const msg = (c.body && c.body.trim()) ? `<pre class="cmsg">${h(c.body.trim())}</pre>` : '';
    return `<div class="commit${i >= MOBILE_COMMITS ? ' extra' : ''}">
      <div class="crow" onclick="this.parentElement.classList.toggle('open')" title="${h(c.short)}: ${h(c.subject)}">
        <span class="cnode"></span>
        <div class="ctext">
          <div class="cmain"><span class="chash">${h(c.short)}:</span> ${h(c.subject)}</div>
          <div class="cdate">${h(c.relDate)}</div>
        </div>
      </div>
      <div class="cdetail">${msg}<div class="cfiles">${files || '<span class="empty">No file changes.</span>'}</div></div>
    </div>`;
  }).join('') + (r.commits.length > MOBILE_COMMITS
    ? `<button class="cmore" onclick="this.closest('.commits').classList.add('expanded')">Show all ${r.commits.length} commits</button>` : '');
}
// --- notes: formatted read view, tap to edit ---------------------------------
// Deliberately minimal: bullets, **bold**, `code`, bare URLs, and #NN job
// cross-links. Input stays plain text in jobs.json.
function fmtNotes(note, id) {
  if (!note || !note.trim()) {
    return `<div class="dnotes-view empty-note" onclick="notesEdit('${h(id)}')">Add a blurb — what is this job, what's blocking it, next steps… (tap to edit)</div>`;
  }
  const inline = s => s
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/https?:\/\/[^\s<]*[^\s<.,);]/g, m =>
      `<a href="${m}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${m}</a>`)
    .replace(/(^|[\s(])#(\d+)\b/g, (m, pre, n) =>
      jobs.some(x => x.num === Number(n))   // only real jobs get a link (#5835 might be a PR)
        ? `${pre}<a class="jref" onclick="event.stopPropagation();openJobByNum(${n})">#${n}</a>`
        : m);
  const lines = h(note).split('\n');
  let out = '', inList = false;
  for (const ln of lines) {
    const m = ln.match(/^\s*[-*]\s+(.*)/);
    if (m) {
      if (!inList) { out += '<ul>'; inList = true; }
      out += `<li>${inline(m[1])}</li>`;
    } else {
      if (inList) { out += '</ul>'; inList = false; }
      out += ln.trim() === '' ? '<div class="nsp"></div>' : `<div>${inline(ln)}</div>`;
    }
  }
  if (inList) out += '</ul>';
  return `<div class="dnotes-view" onclick="notesEdit('${h(id)}')" title="Tap to edit">${out}</div>`;
}

function togglePrRow() {
  const row = document.getElementById('pr-row');
  if (!row) return;
  const open = row.classList.toggle('open');
  if (open) {
    const i = document.getElementById('job-pr');
    if (i && !i.value) i.focus();
  }
}

function openJobByNum(n) {
  const j = jobs.find(x => x.num === n);
  if (j) openJob(j.id);
}

function autosizeNotes(ta) {
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight + 2) + 'px';   // CSS max-height caps it
}

function notesEdit(id) {
  const wrap = document.getElementById('job-notes-wrap');
  if (!wrap || document.getElementById('job-notes')) return;
  const j = jobs.find(x => x.id === id);
  wrap.innerHTML = `<textarea class="dnotes" id="job-notes" oninput="autosizeNotes(this)"
    placeholder="Add a blurb — what is this job, what's blocking it, next steps…"></textarea>`;
  const ta = document.getElementById('job-notes');
  ta.value = (j && j.note) || '';
  autosizeNotes(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

async function saveNotes(id) {
  const ta = document.getElementById('job-notes');
  if (!ta) return;                       // view mode — nothing edited
  await saveJob(id, { note: ta.value });
  openJob(id);                           // re-render back to the read view
}
function addDoc(id) {
  const path = prompt('Document path (relative to repo root, or absolute):');
  if (!path) return;
  const j = jobs.find(x => x.id === id);
  const docs = Array.isArray(j.docs) ? [...j.docs] : [];
  const name = path.split(/[\\/]/).pop();
  docs.push({ name, path, type: docType(name) });
  saveJob(id, { docs });
}
function removeDoc(id, index) {
  const j = jobs.find(x => x.id === id);
  const docs = Array.isArray(j.docs) ? [...j.docs] : [];
  docs.splice(index, 1);
  saveJob(id, { docs });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); } });

// =====================================================================
// RESPONSIVE MODES:
//   wide   — desktop: embedded board pane + rail sidebar.
//   narrow — phone portrait / tall-narrow window: rail only, board via Expand.
//   slab   — phone LANDSCAPE (short viewport): the board IS the app, rail
//            hidden. Rotating the phone flips rail <-> board automatically.
// ?m=1 forces narrow, ?land=1 forces slab (testing/screenshot hatches).
// =====================================================================
const NARROW_MQ = window.matchMedia('(max-width:760px), (max-aspect-ratio:3/4)');
const SLAB_MQ = window.matchMedia('(max-height:520px)');
const NARROW_FORCE = new URLSearchParams(location.search).has('m');
const SLAB_FORCE = new URLSearchParams(location.search).has('land');
const isMobile = () => document.body.classList.contains('narrow');
function applyResponsiveMode() {
  const slab = (SLAB_MQ.matches || SLAB_FORCE) && !NARROW_FORCE;
  const narrow = !slab && (NARROW_MQ.matches || NARROW_FORCE);
  document.body.classList.toggle('slab', slab);
  document.body.classList.toggle('narrow', narrow);
  // entering slab: the embedded pane is already the full-screen board — a still-open
  // takeover from portrait would just double it, so drop it
  if (slab && document.querySelector('.modal.board')) closeModal();
  renderBoardPane();
  applyRail();
}
NARROW_MQ.addEventListener('change', applyResponsiveMode);
SLAB_MQ.addEventListener('change', applyResponsiveMode);

function jobsEmptyTap() { if (!isMobile()) openKanban(); }

applyResponsiveMode();

// --- go --------------------------------------------------------------------
init();
</script>
