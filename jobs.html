<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs</title>
<!-- Favicon: the same kanban board mark as the header logo. The .ico is what "install as app" and
     Windows shortcuts pick up (an SVG data-URI alone can't do that); the SVG below is a crisp
     fallback for browsers that prefer it. Source is jobs-mark.svg — regenerate the raster with the
     gen-icons recipe if the mark ever changes, and keep the header <svg> in sync too. -->
<link rel="icon" type="image/x-icon" href="/jobs-mark.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect x='1.5' y='1.5' width='45' height='45' rx='11' fill='%23211d16'/><rect x='8' y='9' width='9.6' height='30' rx='2.4' fill='%23fff' opacity='.065'/><rect x='19.2' y='9' width='9.6' height='30' rx='2.4' fill='%23fff' opacity='.065'/><rect x='30.4' y='9' width='9.6' height='30' rx='2.4' fill='%23fff' opacity='.065'/><rect x='10' y='12' width='5.6' height='5' rx='1.5' fill='%237cc3cf'/><rect x='10' y='19' width='5.6' height='5' rx='1.5' fill='%237cc3cf' opacity='.58'/><rect x='10' y='26' width='5.6' height='5' rx='1.5' fill='%237cc3cf' opacity='.58'/><rect x='21.2' y='12' width='5.6' height='5' rx='1.5' fill='%23d8a25f'/><rect x='21.2' y='19' width='5.6' height='5' rx='1.5' fill='%23d8a25f' opacity='.58'/><rect x='32.4' y='12' width='5.6' height='5' rx='1.5' fill='%2374c79c'/></svg>">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg: oklch(0.172 0.007 72);
  --surface: oklch(0.214 0.008 72);
  --raised: oklch(0.258 0.009 72);
  --border: oklch(0.31 0.008 72);
  --border-soft: oklch(0.272 0.007 72);
  --text: oklch(0.945 0.006 72);
  --muted: oklch(0.68 0.012 72);
  --faint: oklch(0.55 0.01 72);
  --accent: oklch(0.75 0.072 196);
  --accent-bg: oklch(0.30 0.04 196);
  --ok: oklch(0.77 0.09 156);
  --warn: oklch(0.81 0.08 78);
  --fail: oklch(0.70 0.115 30);
  --pr: oklch(0.72 0.11 300);
  --ready: oklch(0.77 0.09 200);
  --review: oklch(0.74 0.14 65);
  --done: oklch(0.82 0.13 85);
  --mono: 'Cascadia Code','SF Mono', ui-monospace, 'Consolas', monospace;

  --logo-fg: oklch(0.86 0.07 196);
  --scrim: color-mix(in oklch,var(--bg) 55%,transparent);
  --shadow: none;
  --shadow-pop: 0 18px 44px rgba(0,0,0,.4);
  --shadow-modal: 0 24px 60px rgba(0,0,0,.45);
}

body.light {
  --bg:          oklch(0.959 0.010 87.5);
  --surface:     oklch(1.000 0.000 90);
  --raised:      oklch(0.946 0.012 91.5);
  --border:      oklch(0.862 0.010 252.8);
  --border-soft: oklch(0.906 0.010 93.6);
  --text:        oklch(0.262 0.055 266.5);
  --muted:       oklch(0.470 0.028 264.3);
  --faint:       oklch(0.652 0.015 262.4);
  --accent:      oklch(0.599 0.103 214.7);
  --accent-bg:   oklch(0.933 0.026 211.6);
  --ok:          oklch(0.583 0.099 169.8);
  --warn:        oklch(0.676 0.133 76.2);
  --fail:        oklch(0.588 0.171 32.5);
  --pr:          oklch(0.52 0.16 300);
  --ready:       oklch(0.583 0.099 200);
  --review:      oklch(0.62 0.15 65);
  --done:        oklch(0.60 0.14 70);
  --logo-fg:     var(--accent);
  --scrim:       color-mix(in oklch,#18233F 38%,transparent);
  --shadow:      0 1px 2px rgba(24,35,63,.06), 0 3px 10px rgba(24,35,63,.05);
  --shadow-pop:  0 12px 32px rgba(24,35,63,.14);
  --shadow-modal:0 24px 60px rgba(24,35,63,.18);
}

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--raised); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--border); }

/* stop iOS Safari inflating font sizes in boxes it deems overflow-y — it makes
   doc-row text render at inconsistent sizes depending on path length */
html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif;
  font-size:13px; height:100vh; display:flex; flex-direction:column; letter-spacing:0.005em; overflow:hidden;
}
.mono { font-family:var(--mono); }
a { color:inherit; }

/* ---- status strip (simplified — no docker/aspire/sql/silos gauges, this app has no Actions panel) --- */
#strip { display:flex; align-items:stretch; height:62px; background:var(--surface);
  border-bottom:1px solid var(--border-soft); flex-shrink:0; position:relative; z-index:10; }
.brand { display:flex; align-items:center; gap:11px; padding:0 20px; border-right:1px solid var(--border-soft); }
/* the mark carries its own rounded tile — the chip is just a sizing box that clips to match */
.logo { width:38px; height:38px; border-radius:11px; overflow:hidden; display:grid; place-items:center; }
.logo svg { width:100%; height:100%; display:block; }
.brand .bt b { font-size:16.5px; font-weight:750; letter-spacing:-0.01em; display:block; line-height:1.1; }
.brand .bt span { font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:0.03em; }

.strip-right { margin-left:auto; display:flex; align-items:center; gap:13px; padding:0 18px; }
#strip-age { font-family:var(--mono); font-size:10.5px; color:var(--faint); white-space:nowrap; }
.theme-toggle { background:var(--raised); border:1px solid var(--border); color:var(--muted);
  border-radius:9px; width:33px; height:33px; display:grid; place-items:center; cursor:pointer; padding:0; }
.theme-toggle:hover { color:var(--accent); border-color:var(--accent); }
.theme-toggle svg { width:16px; height:16px; display:block; }
.theme-toggle .moon { display:none; }
body.light .theme-toggle .sun { display:none; }
body.light .theme-toggle .moon { display:block; }

.card { background:var(--surface); border:1px solid var(--border-soft); border-radius:15px;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow); }
.ch { display:flex; align-items:center; gap:10px; padding:13px 17px 11px; }
.ch .ico { width:25px; height:25px; border-radius:8px; background:var(--raised); display:grid; place-items:center;
  color:var(--accent); font-size:12px; }
.ch h3 { font-size:13px; font-weight:600; }
.ch .meta { margin-left:auto; font-size:11.5px; color:var(--faint); }

/* ---- body: on a WIDE viewport the kanban board sits main-stage, rail is a sidebar.
   On a NARROW/tall viewport only the rail shows, full width/height — the kanban is
   reached via Expand as a full-screen takeover. On a SLAB viewport (phone landscape)
   the board alone shows. See applyResponsiveMode(). --- */
#body { flex:1; display:flex; gap:15px; padding:15px; min-height:0; }
#board-pane { flex:1.6; display:flex; flex-direction:column; min-width:0; }
#rail { width:340px; flex-shrink:0; order:-1; }  /* rail sits left of the board pane */

body.narrow #body { padding:10px; }
body.narrow #board-pane { display:none; }               /* wide-only: embedded board pane hidden on narrow */

/* wide viewport: the rail is always the Assigned card — the board pane header owns
   search/Brief/+ New job, so the rail's mode slider and Brief button only exist on
   narrow/slab where the rail is the whole app */
body:not(.narrow):not(.slab) #rail .modebar,
body:not(.narrow):not(.slab) #jobs-brief { display:none; }
body.narrow #rail { width:auto; flex:1; }

/* jobs rail */
.jobs-card { height:100%; }
.badge { background:var(--accent-bg); color:var(--accent); border-radius:20px; padding:2px 9px; font-size:11px; font-weight:600; }
.expand { margin-left:auto; background:none; border:1px solid var(--border-soft); color:var(--muted);
  border-radius:9px; padding:6px 12px; font-size:11.5px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px; }
.expand:hover { color:var(--accent); border-color:var(--accent); }
.expand svg { flex-shrink:0; }
/* wide-viewport Assigned rail: the expand slot is a plain text link to the sprint board */
.expand.aslink { border:none; color:var(--accent); font-size:11px; padding:6px 7px; border-radius:7px; }
.expand.aslink:hover { background:var(--accent-bg); }

/* header pill buttons (Brief, + New job) — same visual weight as Expand */
.hbtn { background:none; border:1px solid var(--border-soft); color:var(--muted);
  border-radius:9px; padding:6px 10px; font-size:11.5px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px; }
.hbtn:hover { color:var(--accent); border-color:var(--accent); }
.hbtn svg { flex-shrink:0; }
#jobs-brief { margin:0 auto; }

/* rail search: icon + pop-out that overlays the whole header row */
.jobs-card .ch { position:relative; }
.jsearch-btn { background:none; border:1px solid var(--border-soft); color:var(--muted);
  width:25px; height:25px; border-radius:8px; cursor:pointer; display:grid; place-items:center;
  flex-shrink:0; transition:.12s; }
.jsearch-btn:hover { color:var(--accent); border-color:var(--accent); }
.jsearch-btn.active { color:var(--accent); background:var(--accent-bg);
  border-color:color-mix(in oklch,var(--accent) 40%,transparent); }
.jsearch-pop { position:absolute; left:0; top:0; bottom:0; display:flex; align-items:center; gap:9px;
  padding:0 17px; background:var(--surface); border-radius:15px 15px 0 0; }
.jsearch-pop.hidden { display:none; }
.jsearch-pop .fico { color:var(--faint); flex-shrink:0; }
.jsearch-pop input { flex:1; min-width:0; background:none; border:none; color:var(--text);
  font-size:13px; font-family:inherit; outline:none; }
.jsearch-clear { background:var(--raised); border:1px solid var(--border-soft); color:var(--muted);
  width:22px; height:22px; border-radius:7px; cursor:pointer; flex-shrink:0; font-size:14px; line-height:1; }
.jsearch-clear:hover { color:var(--accent); border-color:var(--accent); }

/* flexible so it soaks up free space and shrinks on phones instead of pushing
   the close/add buttons off-screen */
.bsearch { display:flex; align-items:center; gap:6px; flex:1; min-width:60px; max-width:280px; margin-left:auto; }
.bsearch input { flex:1; width:auto; min-width:0; background:var(--raised); border:1px solid var(--border-soft);
  border-radius:9px; padding:6px 10px; font-size:12px; font-family:inherit; color:var(--text); outline:none; }
.bsearch input:focus { border-color:var(--accent); }
.bsearch .bsearch-clear { background:var(--raised); border:1px solid var(--border-soft); color:var(--muted);
  width:22px; height:22px; border-radius:7px; cursor:pointer; flex-shrink:0; font-size:14px; line-height:1; }
.bsearch .bsearch-clear:hover { color:var(--accent); border-color:var(--accent); }
.bsearch .bsearch-clear.hidden { display:none; }
#jobs-list { padding:0 15px 15px; display:flex; flex-direction:column; gap:9px; flex:1; min-height:0; overflow-y:auto; }
.job { background:var(--raised); border:1px solid var(--border-soft); border-radius:12px; padding:11px 12px;
  cursor:pointer; transition:.12s; }
.job:hover { border-color:var(--accent); }
.job .jhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.job .jnum { font-family:var(--mono); font-size:10px; font-weight:700; color:var(--faint); }
.job .st { font-size:10px; font-weight:600; padding:2px 9px; border-radius:20px; display:inline-block; }
.s-inprogress .st { background:var(--accent-bg); color:var(--accent); }
.s-ready .st { background:color-mix(in oklch,var(--ready) 18%,var(--surface)); color:var(--ready); }
.s-review .st { background:color-mix(in oklch,var(--review) 18%,var(--surface)); color:var(--review); }
.s-blocked .st { background:color-mix(in oklch,var(--fail) 18%,var(--surface)); color:var(--fail); }
.s-parked .st { background:color-mix(in oklch,var(--warn) 18%,var(--surface)); color:var(--warn); }
.s-pr .st { background:color-mix(in oklch,var(--pr) 18%,var(--surface)); color:var(--pr); }
.s-done .st { background:color-mix(in oklch,var(--ok) 18%,var(--surface)); color:var(--ok); }
.s-planned .st, .s-removed .st { background:var(--raised); color:var(--muted); border:1px solid var(--border-soft); }
.job .jl { font-size:12.5px; font-weight:550; line-height:1.3; }
.job .jb { font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:5px; word-break:break-all; }
/* quick-add: title-only entry pinned at the TOP of the rail (detail opens on create,
   so repo/branch/notes live there). Ghost bar morphs into an inline input. */
.qadd { margin:0 15px 11px; flex-shrink:0; display:flex; align-items:center; gap:8px; min-height:41px;
  border:1.5px dashed color-mix(in oklch,var(--accent) 45%,transparent); border-radius:11px; padding:9px 12px;
  background:color-mix(in oklch,var(--accent-bg) 45%,transparent); color:var(--accent);
  font-size:12.5px; font-weight:600; cursor:pointer; transition:.12s; }
.qadd:hover { border-color:var(--accent); background:var(--accent-bg); }
.qadd.open { border:1px solid var(--accent); background:var(--surface); font-weight:400; cursor:default; }
.qadd input { flex:1; min-width:0; background:none; border:none; outline:none; color:var(--text);
  font-family:inherit; font-size:13px; }
.qadd input::placeholder { color:var(--faint); }
.qadd .qgo { background:var(--accent-bg); border:1px solid color-mix(in oklch,var(--accent) 40%,transparent);
  color:var(--accent); border-radius:8px; padding:4px 12px; font-size:11.5px; cursor:pointer; flex-shrink:0; }
.qadd .qgo:hover { filter:brightness(1.1); }
.empty { color:var(--faint); font-size:12px; padding:14px 4px; }

/* ---- jobs: Assigned (ADO) mode ------------------------------------------- */
.hidden { display:none !important; }
.modebar { padding:0 15px 11px; flex-shrink:0; }
.seg { position:relative; display:grid; grid-template-columns:1fr 1fr;
  background:var(--bg); border:1px solid var(--border-soft); border-radius:11px; padding:3px; }
.seg .glider { position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px);
  background:var(--raised); border:1px solid var(--border); border-radius:8px;
  transition:transform .22s cubic-bezier(.4,.05,.2,1); }
.seg[data-mode="ado"] .glider { transform:translateX(100%); }
.seg button { position:relative; z-index:1; background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:11.5px; font-weight:600; color:var(--faint); padding:7px 8px;
  display:flex; align-items:center; justify-content:center; gap:6px; transition:color .18s; }
.seg button.on { color:var(--text); }
.seg button .sgl { font-size:11px; opacity:.85; }
.seg[data-mode="personal"] button[data-m="personal"] .sgl,
.seg[data-mode="ado"] button[data-m="ado"] .sgl { color:var(--accent); }

.idrow { display:none; align-items:center; gap:9px; margin:0 15px 10px; padding:8px 10px;
  background:var(--bg); border:1px solid var(--border-soft); border-radius:10px; flex-shrink:0; }
.idrow .avatar { width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  font-size:9.5px; font-weight:700; letter-spacing:-0.02em; flex-shrink:0;
  background:color-mix(in oklch,var(--accent) 26%,var(--surface)); color:var(--accent);
  border:1px solid color-mix(in oklch,var(--accent) 30%,transparent); }
.idrow .idsum { font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.idrow .idsum b { color:var(--text); font-weight:600; }
.idrow .idsum .done { color:var(--done); font-weight:700; }
.idrow .idrefresh { margin-left:auto; background:none; border:1px solid var(--border-soft); color:var(--muted);
  width:24px; height:24px; border-radius:7px; cursor:pointer; font-size:13px; line-height:1; flex-shrink:0; transition:.12s; }
.idrow .idrefresh:hover { color:var(--accent); border-color:var(--accent); }
.idrow .idrefresh.spin { animation:oh-pulse 1s infinite; }
@keyframes oh-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.story { background:var(--bg); border:1px solid var(--border-soft); border-radius:13px; padding:10px;
  position:relative; }
.story::before { content:""; position:absolute; left:0; top:11px; bottom:11px; width:2px; border-radius:2px;
  background:var(--accent); opacity:.55; }
.story.st-ready::before { background:var(--pr); }
.story-head { padding-left:8px; cursor:default; }
.story-top { display:flex; align-items:center; gap:7px; }
.story-type { font-family:var(--mono); font-size:8.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--faint); border:1px solid var(--border-soft); border-radius:5px; padding:1px 5px; }
.id { font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.id .hash { color:var(--faint); }
.story-title { font-size:12.5px; font-weight:600; line-height:1.32; margin-top:6px; }

.state { font-size:9.5px; font-weight:650; padding:2px 8px; border-radius:20px; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px; }
.state::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.state.ml { margin-left:auto; }
.a-inprogress { background:var(--accent-bg); color:var(--accent); }
.a-ready { background:color-mix(in oklch,var(--pr) 18%,var(--surface)); color:var(--pr); }
.a-todo { background:var(--raised); color:var(--muted); border:1px solid var(--border-soft); }

.ado-pane { display:none; padding:9px 2px 3px 8px; margin-top:8px; border-top:1px solid var(--border-soft);
  flex-direction:column; gap:9px; }
.story.open > .ado-pane, .task.open > .ado-pane { display:flex; }
.ado-tags { display:flex; flex-wrap:wrap; gap:5px; }
.ado-tag { font-size:9.5px; color:var(--muted); background:var(--raised); border:1px solid var(--border-soft);
  border-radius:6px; padding:2px 7px; }
.ado-sub { font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--faint); margin-bottom:4px; }
.ado-text { font-size:11.5px; color:var(--muted); line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.ado-open { align-self:flex-start; font-size:11px; color:var(--accent); text-decoration:none;
  border:1px solid color-mix(in oklch,var(--accent) 35%,transparent); border-radius:8px; padding:4px 10px; }
.ado-open:hover { background:var(--accent-bg); }

.story-meta { margin-top:6px; padding:8px 0 0 8px; border-top:1px solid var(--border-soft);
  display:flex; flex-direction:column; gap:7px; }
.ado-meta-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ado-meta-row .ado-tags { flex:1; }
.ado-meta-row .ado-open { margin-left:auto; flex-shrink:0; }
.ado-toggles { display:flex; gap:10px; }
.ado-toggle { background:none; border:none; padding:0; font-family:inherit; font-size:11px;
  color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:3px; }
.ado-toggle:hover,.ado-toggle.active { color:var(--accent); }
.ado-arr { font-size:10px; transition:transform .15s; }
.ado-toggle.active .ado-arr { transform:rotate(180deg); }
.ado-section { display:none; background:var(--raised); border-radius:6px; padding:8px 10px; }
.ado-section.open { display:block; }

.tasks { margin:9px 0 0 8px; display:flex; flex-direction:column; gap:6px; }
.tasks-h { font-family:var(--mono); font-size:8.5px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--faint); display:flex; align-items:center; gap:6px; }
.tasks-h .ln { flex:1; height:1px; background:var(--border-soft); }
.task { background:var(--raised); border:1px solid var(--border-soft); border-radius:10px; padding:9px 10px;
  transition:.12s; }
.task:hover { border-color:var(--accent); }
.task-head { cursor:pointer; }
.task-top { display:flex; align-items:center; gap:7px; }
.task-title { font-size:12px; font-weight:500; line-height:1.3; margin-top:6px; }

.synced { margin:6px 15px 15px; display:flex; align-items:center; justify-content:center; gap:7px;
  font-family:var(--mono); font-size:10px; color:var(--faint); padding:9px; cursor:pointer;
  border:1px dashed var(--border-soft); border-radius:11px; flex-shrink:0; }
.synced:hover { color:var(--muted); border-color:var(--border); }
.synced .pulse { width:6px; height:6px; border-radius:50%; background:var(--ok);
  box-shadow:0 0 0 3px color-mix(in oklch,var(--ok) 16%,transparent); }
.synced.err .pulse { background:var(--fail); box-shadow:0 0 0 3px color-mix(in oklch,var(--fail) 16%,transparent); }

/* ---- modals -------------------------------------------------------------- */
.modal-bg { position:fixed; inset:0; background:var(--scrim);
  backdrop-filter:blur(3px); display:grid; place-items:center; z-index:80; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:18px; display:flex;
  flex-direction:column; overflow:hidden; box-shadow:var(--shadow-modal); }
/* the board is a full-screen takeover, not a floating dialog — reuses the modal
   plumbing (modal-root, closeModal) but stretches edge to edge at every size */
.modal-bg.takeover { place-items:stretch; }
.modal.board { width:100%; height:100dvh; max-height:none; border-radius:0; border:none; }
.mplus { width:30px; height:30px; border-radius:9px; background:var(--raised); display:grid; place-items:center;
  border:1px solid var(--border-soft); color:var(--muted); cursor:pointer; flex-shrink:0; padding:0; font-size:17px; line-height:1; }
.mplus:hover { color:var(--text); border-color:var(--accent); }
.modal.detail { width:min(820px,92vw); max-height:88vh; }
.mhead { display:flex; align-items:center; gap:12px; padding:17px 22px; border-bottom:1px solid var(--border-soft); }
.mhead .mico { width:28px; height:28px; border-radius:9px; background:var(--raised); display:grid; place-items:center;
  color:var(--accent); flex-shrink:0; }
.mhead .mnum { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--faint); flex-shrink:0; }
.mhead h2 { font-size:16px; font-weight:650; }
.mclose { margin-left:auto; width:30px; height:30px; border-radius:9px; background:var(--raised);
  border:1px solid var(--border-soft); color:var(--muted); cursor:pointer; font-size:15px; flex-shrink:0; }
.mclose:hover { color:var(--text); border-color:var(--accent); }
.mboard { width:30px; height:30px; border-radius:9px; background:var(--raised); display:grid; place-items:center;
  border:1px solid var(--border-soft); color:var(--muted); cursor:pointer; flex-shrink:0; padding:0; }
.mboard:hover { color:var(--text); border-color:var(--accent); }

/* kanban */
.board-cols { flex:1; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(220px,1fr); gap:14px;
  padding:18px 22px; min-height:0; overflow-x:auto; }
.bcol { background:var(--bg); border:1px solid var(--border-soft); border-radius:13px; display:flex;
  flex-direction:column; overflow:hidden; transition:.12s; }
.bcol.dragover { border-color:var(--accent); background:var(--accent-bg); }
.bcolh { display:flex; align-items:center; gap:8px; padding:12px 14px; font-size:12px; font-weight:600; }
.bcolh .dot { width:8px; height:8px; border-radius:50%; }
.bcolh .ct { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); }
.bcards { padding:0 11px 11px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; }
.bcard { background:var(--surface); border:1px solid var(--border-soft); border-radius:11px; padding:11px 12px;
  cursor:grab; transition:.12s; }
.bcard:hover { border-color:var(--accent); }
.bcard.dragging { opacity:.4; cursor:grabbing; }
.bcard .bjnum { font-family:var(--mono); font-size:10px; font-weight:700; color:var(--faint); margin-bottom:5px; }
.bcard .l { font-size:12.5px; font-weight:550; line-height:1.3; }
.bcard .b { font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:6px; word-break:break-all; }
.prchip { display:inline-block; margin-top:6px; font-family:var(--mono); font-size:10px; font-weight:600;
  padding:2px 8px; border-radius:20px; background:color-mix(in oklch,var(--pr) 18%,var(--surface)); color:var(--pr);
  text-decoration:none; }
.prchip:hover { filter:brightness(1.15); }
/* embedded board pane (wide-viewport, non-modal) — same column markup as the modal board */
#board-pane .card { flex:1; min-height:0; }
#board-pane .board-cols { padding:14px; }

/* job detail */
.detail-body { padding:20px 22px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:18px; }
.drow { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.dlabel { font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:0.06em; }
/* label+field groups: inline on desktop, label-above on narrow (16px touch
   controls are too wide for one inline row) */
.dfield { display:flex; align-items:center; gap:10px; min-width:0; }
.dfield.fwide { flex:1; }
.fwrap { display:flex; align-items:center; gap:10px; flex:1; min-width:0; position:relative; }
.fwrap input { flex:1; min-width:0; }
.fwrap input.padlink { padding-right:34px; }
.fwrap .prlink { position:absolute; right:11px; top:50%; transform:translateY(-50%); }
.mono-fld { font-family:var(--mono); font-size:12px; }
.dfield.fwide > input { flex:1; min-width:0; }
/* PR reveal button beside Branch — mobile only; tinted when a PR exists */
.prtoggle { display:none; }
body.narrow .modal.detail .prtoggle { display:grid; place-items:center; align-self:stretch; width:42px;
  flex-shrink:0; background:var(--bg); border:1px solid var(--border); border-radius:9px;
  color:var(--muted); font-size:16px; cursor:pointer; padding:0; }
body.narrow .modal.detail .prtoggle.has { color:var(--pr);
  border-color:color-mix(in oklch,var(--pr) 45%,transparent);
  background:color-mix(in oklch,var(--pr) 14%,var(--bg)); }
body.narrow .modal.detail #pr-row { display:none; }
body.narrow .modal.detail #pr-row.open { display:flex; }
.dsel { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:7px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
.prlink { color:var(--pr); font-size:14px; text-decoration:none; }
.prlink:hover { filter:brightness(1.15); }
.dsec h4 { font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:9px;
  display:flex; align-items:center; }
.dsec h4 .add { margin-left:auto; color:var(--accent); cursor:pointer; text-transform:none; letter-spacing:0; font-size:11px; }
/* notes auto-grow to fit, capped so the docs section (first handover title) still
   peeks out below; past the cap the notes themselves scroll */
.dnotes { width:100%; background:var(--bg); border:1px solid var(--border-soft); border-radius:11px; color:var(--text);
  padding:12px 14px; font-size:13.5px; line-height:1.6; font-family:inherit; resize:none; min-height:84px;
  max-height:40dvh; overflow-y:auto; }
.dnotes-view { background:var(--bg); border:1px solid var(--border-soft); border-radius:11px;
  padding:12px 14px; font-size:13.5px; line-height:1.6; max-height:40dvh; overflow-y:auto;
  cursor:text; word-break:break-word; }
.dnotes-view:hover { border-color:var(--border); }
.dnotes-view.empty-note { color:var(--faint); min-height:84px; }
.dnotes-view ul { margin:2px 0; padding-left:20px; }
.dnotes-view li { margin:2px 0; }
.dnotes-view code { font-family:var(--mono); font-size:12px; background:var(--raised); border-radius:5px; padding:1px 5px; }
.dnotes-view a { color:var(--accent); text-decoration:none; }
.dnotes-view a[href] { word-break:break-all; }
.dnotes-view a:hover { text-decoration:underline; }
.dnotes-view .jref { cursor:pointer; font-weight:600; }
.dnotes-view .nsp { height:9px; }
.dcols { display:flex; gap:18px; align-items:flex-start; }
.dcols .dcol { flex:1; min-width:0; }
.docs { display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; }
.doc { display:flex; align-items:center; gap:11px; padding:10px 12px; background:var(--bg);
  border:1px solid var(--border-soft); border-radius:11px; cursor:pointer; transition:.12s; }
.doc:hover { border-color:var(--accent); background:var(--raised); }
.doc .di { width:26px; height:26px; border-radius:7px; display:grid; place-items:center; font-family:var(--mono);
  font-size:9px; font-weight:700; flex-shrink:0; }
.doc .di.md { background:color-mix(in oklch,var(--accent) 20%,var(--bg)); color:var(--accent); }
.doc .di.code { background:color-mix(in oklch,var(--warn) 20%,var(--bg)); color:var(--warn); }
.doc .di.other { background:var(--raised); color:var(--muted); }
.doc .dmeta { min-width:0; }
.doc .dn { font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.doc .dp { font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.doc .dcp { margin-left:auto; flex-shrink:0; width:22px; height:22px; border:none; border-radius:6px;
  background:transparent; color:var(--faint); font-size:13px; line-height:1; cursor:pointer; transition:.12s; }
.doc .dcp:hover { background:var(--accent-bg); color:var(--accent); }
.doc .dcp.ok { color:var(--ok); }
.doc .drm { flex-shrink:0; width:22px; height:22px; border:none; border-radius:6px;
  background:transparent; color:var(--faint); font-size:16px; line-height:1; cursor:pointer; transition:.12s; }
.doc .drm:hover { background:color-mix(in oklch,var(--fail) 18%,var(--bg)); color:var(--fail); }
.cbranch { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:none; letter-spacing:0; }
.commits { display:flex; flex-direction:column; max-height:300px; overflow-y:auto; }
.commit { position:relative; }
.commit:not(:last-child)::before { content:''; position:absolute; left:9.5px; top:0; bottom:0; width:1.5px; background:var(--border); }
.crow { display:flex; align-items:flex-start; gap:10px; padding:8px 4px 8px 24px; cursor:pointer; position:relative; border-radius:8px; }
.crow:hover { background:var(--raised); }
.cnode { position:absolute; left:6px; top:13px; width:8px; height:8px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 0 3px var(--surface); z-index:1; }
.ctext { flex:1; min-width:0; }
.cmain { font-size:12.5px; color:var(--text); line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.chash { font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.cdate { font-size:10px; color:var(--faint); text-align:right; margin-top:2px; }
.cdetail { display:none; padding:2px 4px 10px 24px; }
.commit.open .cdetail { display:block; }
.cmsg { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:pre-wrap; word-break:break-word;
  margin:0 0 8px; padding:8px 10px; background:var(--bg); border:1px solid var(--border-soft); border-radius:8px; line-height:1.5; }
.cfiles { display:flex; flex-direction:column; gap:3px; }
.cf { display:flex; align-items:center; gap:8px; font-size:11px; }
.cfp { font-family:var(--mono); color:var(--muted); word-break:break-all; }
.cs { width:15px; text-align:center; font-family:var(--mono); font-size:9px; font-weight:700; border-radius:4px; flex-shrink:0; }
.cs-A { background:color-mix(in oklch,var(--ok) 22%,var(--bg)); color:var(--ok); }
.cs-M { background:color-mix(in oklch,var(--warn) 22%,var(--bg)); color:var(--warn); }
.cs-D { background:color-mix(in oklch,var(--fail) 22%,var(--bg)); color:var(--fail); }
.cs-R { background:color-mix(in oklch,var(--accent) 22%,var(--bg)); color:var(--accent); }
.cmore { display:none; width:100%; background:none; border:1px dashed var(--border-soft); color:var(--muted);
  border-radius:9px; padding:8px; font-size:11.5px; font-family:inherit; cursor:pointer; margin-top:6px; }
.cmore:hover { color:var(--accent); border-color:var(--accent); }
.dollar { padding:18px 22px; border-top:1px solid var(--border-soft); display:flex; gap:10px; justify-content:flex-end; }
.dbtn { background:var(--raised); border:1px solid var(--border-soft); color:var(--muted); border-radius:10px;
  padding:9px 16px; font-size:12.5px; cursor:pointer; }
.dbtn:hover { border-color:var(--accent); color:var(--accent); }
.dbtn.danger:hover { border-color:var(--fail); color:var(--fail); }
.dbtn.prime { background:var(--accent-bg); border-color:color-mix(in oklch,var(--accent) 40%,transparent); color:var(--accent); }

/* =====================================================================
   NARROW MODE (decision 7): rail-only, full-screen-friendly. Applied via
   body.narrow, toggled by matchMedia('(max-width:760px), (max-aspect-ratio:3/4)')
   — width covers phones-in-portrait-and-landscape, the aspect-ratio clause
   also catches narrow-but-tall split-screen/tablet windows that width alone
   would miss. ?m=1 forces it as a manual escape hatch.
   ===================================================================== */
.mcaret { display:none; }
.m-fld { width:100%; background:var(--bg); border:1px solid var(--border-soft); border-radius:11px;
  color:var(--text); padding:12px 14px; font-size:14px; font-family:inherit; }
.m-fld::placeholder { color:var(--faint); }
.m-fld.mono { font-family:var(--mono); font-size:12.5px; }

body.narrow { height:auto; min-height:100vh; overflow-x:hidden; overflow-y:auto; }
body.narrow #strip { height:auto; flex-wrap:wrap; align-items:center; gap:8px; padding:9px 12px; position:sticky; top:0; }
body.narrow .brand { flex:1 1 auto; padding:0; border-right:none; gap:9px; }
body.narrow .brand .logo { width:32px; height:32px; }
body.narrow .strip-right { margin-left:auto; padding:0; gap:9px; }

body.narrow #body { flex-direction:column; gap:12px; padding:12px; overflow:visible; min-height:0; }
body.narrow .jobs-card { height:auto; }
body.narrow #jobs-list { overflow:visible; flex:none; max-height:none; }
body.narrow .qadd { padding:11px 12px; }

body.narrow .modal-bg, body.slab .modal-bg { place-items:stretch; }
body.narrow .modal.detail, body.slab .modal.detail { width:100vw; height:100dvh; max-height:100dvh; border-radius:0; border:none; }
body.narrow .modal.detail.m-add, body.slab .modal.detail.m-add {
  width:min(480px,94vw); height:auto; max-height:none; border-radius:18px; border:1px solid var(--border); margin:auto; }
/* stacked columns must STRETCH to viewport width (flex-start would size them to
   their content, letting long doc paths force a horizontal scroll) */
body.narrow .modal.detail .dcols { flex-direction:column; gap:18px; align-items:stretch; }
/* title drops below the icon/number/close row so it can run full width */
body.narrow .modal.detail .mhead { flex-wrap:wrap; row-gap:9px; padding:14px 18px; }
body.narrow .modal.detail .mhead h2 { flex-basis:100%; order:9; }
/* on a phone the docs are the jump-off point — they go first, and long commit
   histories collapse to the latest few behind a "show all" toggle */
body.narrow .modal.detail .col-docs { order:-1; }
body.narrow .modal.detail .drow { gap:12px; }
body.narrow .modal.detail .dfield { flex:1; flex-direction:column; align-items:stretch; gap:6px; }
body.narrow .modal.detail .dfield.fwide { flex-basis:100%; }
body.narrow .modal.detail .commit.extra { display:none; }
body.narrow .modal.detail .commits.expanded .commit.extra { display:block; }
body.narrow .modal.detail .commits:not(.expanded) .cmore { display:block; }
body.narrow .modal.detail .dsec h4 .add { display:none; }
body.narrow .modal.detail .commits, body.narrow .modal.detail .docs { max-height:none; }
body.narrow .dollar, body.slab .dollar { justify-content:stretch; flex-wrap:wrap; }
body.narrow .dollar .dbtn, body.slab .dollar .dbtn { flex:1; }
body.narrow .dollar .dbtn.prime, body.slab .dollar .dbtn.prime { flex:2; }

/* takeover board header on a portrait phone: drop the badge and the Brief label
   so search / add / close all stay on-screen */
body.narrow .modal.board .mhead { padding:13px 14px; gap:8px; }
body.narrow .modal.board .mhead .badge { display:none; }
body.narrow .modal.board .hbtn .btxt { display:none; }
body.narrow .board-cols { padding:12px 14px; }

/* =====================================================================
   SLAB MODE: phone held LANDSCAPE (short viewport). The rail hides and
   the kanban board IS the app, full width — rotating the phone flips
   between rail (portrait/narrow) and board (landscape/slab). ?land=1
   forces it for testing/screenshots. ADO mode has no board, so the rail
   stays put there (body.ado).
   ===================================================================== */
body.slab #strip { height:auto; padding:7px 12px; }
body.slab .brand { padding:0; border-right:none; gap:9px; }
body.slab .brand .logo { width:30px; height:30px; }
body.slab .strip-right { padding:0 0 0 12px; }
body.slab #body { padding:10px; gap:10px; }
body.slab #board-pane .board-cols { padding:12px; }
body.slab:not(.ado) #rail { display:none; }
body.slab.ado #board-pane { display:none !important; }
body.slab.ado #rail { width:auto; flex:1; }

/* iOS Safari auto-zooms into any focused field whose font-size is under 16px —
   on touch devices hold every form control at 16px so it never fires. !important
   is deliberate: this must beat every per-component size, and only here. */
@media (pointer:coarse) {
  input, select, textarea { font-size:16px !important; }
}
</style>

<script>
  (function () {
    var t;
    try { t = localStorage.getItem('jobs-theme'); } catch (e) {}
    if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    if (t === 'light') document.body.classList.add('light');
  })();
</script>

<header id="strip">
  <div class="brand">
    <div class="logo">
      <!-- Kanban board mark: ready (teal) / review (amber) / done (green) columns, cards stepping
           down as work clears. Self-contained tile so it holds from here down to the 16px favicon
           (kept in sync with the <link rel="icon"> in <head>). -->
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#211d16"/>
        <rect x="8"    y="9" width="9.6" height="30" rx="2.4" fill="#fff" opacity=".065"/>
        <rect x="19.2" y="9" width="9.6" height="30" rx="2.4" fill="#fff" opacity=".065"/>
        <rect x="30.4" y="9" width="9.6" height="30" rx="2.4" fill="#fff" opacity=".065"/>
        <rect x="10"   y="12" width="5.6" height="5" rx="1.5" fill="#7cc3cf"/>
        <rect x="10"   y="19" width="5.6" height="5" rx="1.5" fill="#7cc3cf" opacity=".58"/>
        <rect x="10"   y="26" width="5.6" height="5" rx="1.5" fill="#7cc3cf" opacity=".58"/>
        <rect x="21.2" y="12" width="5.6" height="5" rx="1.5" fill="#d8a25f"/>
        <rect x="21.2" y="19" width="5.6" height="5" rx="1.5" fill="#d8a25f" opacity=".58"/>
        <rect x="32.4" y="12" width="5.6" height="5" rx="1.5" fill="#74c79c"/>
      </svg>
    </div>
    <div class="bt"><b>Jobs</b><span>localhost:7799</span></div>

  <div class="strip-right">

      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div id="body">
  <div id="board-pane">
    <div class="card">
      <div class="ch"><span class="ico">▦</span><h3>Board</h3><span class="badge" id="board-count">0</span>
        <div class="bsearch">
          <input placeholder="Search…" autocomplete="off" oninput="onBoardSearchInput(event)">
